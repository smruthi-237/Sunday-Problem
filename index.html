
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SlopeGuard | Landslide Monitoring Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Full-screen map -->
  <div id="map"></div>

  <!-- Loading and error message -->
  <div class="map-message" id="mapMessage" role="status">
    Loading map data...
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    "use strict";

    // ==========================================
    // 1. INITIALIZE MAP
    // ==========================================

    const map = L.map("map").setView([20, 0], 2);

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    L.control.scale({
      metric: true,
      imperial: false
    }).addTo(map);

    // Keep all five sensor markers on one layer.
    // No visible layer-switching control is added.
    const monitoringLayer = L.layerGroup().addTo(map);

    const mapMessage = document.getElementById("mapMessage");
    const sensorStations = [];

    // ==========================================
    // 2. HELPER FUNCTIONS
    // ==========================================

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function formatTime(date) {
      return date.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    // ==========================================
    // 3. SIMULATED SENSOR READINGS
    // Demonstration values only.
    // ==========================================

    function randomBetween(min, max, decimals = 1) {
      const value = min + Math.random() * (max - min);
      return Number(value.toFixed(decimals));
    }

    function generateSensorReadings() {
      return {
        rainfall: randomBetween(0, 60, 1),
        soilMoisture: randomBetween(20, 90, 1),
        tilt: randomBetween(0, 0.5, 3),
        soilThicknessEstimate: randomBetween(0.2, 2.5, 2),
        waterIndex: randomBetween(0, 100, 1)
      };
    }

    // ==========================================
    // 4. UNIFORM SENSOR MARKER
    // All markers use the same blue colour.
    // Labels are A, B, C, D and E.
    // ==========================================

    function createSensorIcon(label) {
      return L.divIcon({
        className: "sensor-marker-wrapper",
        html: `
          <div class="sensor-marker">
            ${escapeHTML(label)}
          </div>
        `,
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });
    }

    // ==========================================
    // 5. SENSOR POPUP CONTENT
    // ==========================================

    function sensorPopupHTML(station) {
      const r = station.readings;

      return `
        <div class="sensor-popup">

          <div class="popup-heading">
            <strong>${escapeHTML(station.id)}</strong>
            <span class="simulated-badge">SIMULATED</span>
          </div>

          <div class="popup-subtitle">
            Monitoring station · Demo readings
          </div>

          <div class="popup-reading">
            <span class="reading-icon">🌧️</span>
            <span class="reading-name">Rainfall rate</span>
            <strong>${r.rainfall} mm/h</strong>
          </div>

          <div class="popup-reading">
            <span class="reading-icon">💧</span>
            <span class="reading-name">Soil moisture</span>
            <strong>${r.soilMoisture}%</strong>
          </div>

          <div class="popup-reading">
            <span class="reading-icon">📐</span>
            <span class="reading-name">Tilt change</span>
            <strong>${r.tilt.toFixed(3)}°</strong>
          </div>

          <div class="popup-reading">
            <span class="reading-icon">〰️</span>
            <span class="reading-name">Acoustic thickness estimate</span>
            <strong>${r.soilThicknessEstimate.toFixed(2)} m</strong>
          </div>

          <div class="popup-reading">
            <span class="reading-icon">🌊</span>
            <span class="reading-name">Water index</span>
            <strong>${r.waterIndex}%</strong>
          </div>

          <div class="popup-reading soil-record">
            <span class="reading-icon">🌱</span>
            <span class="reading-name">Recorded soil thickness</span>
            <strong>${station.recordedSoilThickness.toFixed(2)} m</strong>
          </div>

          <div class="popup-footer">
            <span class="live-dot"></span>
            Random demo readings · Updates every 3 minutes
          </div>

          <div class="popup-updated">
            Last updated: ${formatTime(station.updatedAt)}
          </div>

          <div class="popup-disclaimer">
            Sensor values are simulated. Recorded soil thickness comes
            from the CSV and does not change automatically. The acoustic
            estimate and water index are placeholders, not validated
            measurements.
          </div>

        </div>
      `;
    }

    // ==========================================
    // 6. CREATE SENSOR STATION
    // Sensor IDs are assigned by location order,
    // not from CSV sample numbers.
    // ==========================================

    function addSensorStation(lat, lon, thickness) {
      // Assign the next letter based on valid locations.
      const letter = String.fromCharCode(
        65 + sensorStations.length
      );

      const station = {
        id: "Sensor Reading " + letter,
        label: letter,
        lat: lat,
        lon: lon,
        recordedSoilThickness: thickness,
        readings: generateSensorReadings(),
        updatedAt: new Date(),
        marker: null,
        popupOpen: false
      };

      const marker = L.marker([lat, lon], {
        icon: createSensorIcon(letter),
        keyboard: true,
        title: station.id
      }).addTo(monitoringLayer);

      station.marker = marker;

      marker.bindPopup(sensorPopupHTML(station), {
        maxWidth: 320,
        minWidth: 250,
        autoPan: true
      });

      marker.on("popupopen", () => {
        station.popupOpen = true;
      });

      marker.on("popupclose", () => {
        station.popupOpen = false;
      });

      sensorStations.push(station);
    }

    // ==========================================
    // 7. LOAD CSV AND SELECT FIVE LOCATIONS
    // ==========================================

    fetch("./soil_thickness.csv")
      .then(response => {
        if (!response.ok) {
          throw new Error(
            "Could not load soil_thickness.csv. Check the file location."
          );
        }

        return response.text();
      })

      .then(csv => {
        const rows = csv.trim().split(/\r?\n/);

        if (rows.length < 2) {
          throw new Error("The CSV contains no data records.");
        }

        const headers = rows[0]
          .split(",")
          .map(header => header.trim());

        const latIndex = headers.indexOf("latitude_N");
        const lonIndex = headers.indexOf("longitude_E");
        const thicknessIndex = headers.indexOf("soil_thickness_m");

        if (
          latIndex === -1 ||
          lonIndex === -1 ||
          thicknessIndex === -1
        ) {
          throw new Error(
            "Required CSV columns are missing: latitude_N, longitude_E, soil_thickness_m."
          );
        }

        const dataRows = rows
          .slice(1)
          .filter(row => row.trim() !== "");

        // Select at most five evenly spaced rows.
        const pointCount = Math.min(5, dataRows.length);
        const selectedRows = [];

        for (let i = 0; i < pointCount; i++) {
          const index = pointCount === 1
            ? 0
            : Math.round(
                i * (dataRows.length - 1) / (pointCount - 1)
              );

          selectedRows.push(dataRows[index]);
        }

        const mapBounds = [];

        selectedRows.forEach(row => {
          const columns = row.split(",");

          const lat = Number(columns[latIndex]);
          const lon = Number(columns[lonIndex]);
          const thickness = Number(columns[thicknessIndex]);

          if (
            !Number.isFinite(lat) ||
            !Number.isFinite(lon) ||
            !Number.isFinite(thickness) ||
            lat < -90 ||
            lat > 90 ||
            lon < -180 ||
            lon > 180 ||
            thickness < 0
          ) {
            return;
          }

          // The CSV determines location and thickness only.
          // The marker label and popup ID are assigned A–E.
          addSensorStation(lat, lon, thickness);

          mapBounds.push([lat, lon]);
        });

        if (mapBounds.length > 0) {
          map.fitBounds(mapBounds, {
            padding: [30, 30],
            maxZoom: 13
          });

          mapMessage.textContent =
            `Loaded ${mapBounds.length} sensor locations.`;

          window.setTimeout(() => {
            mapMessage.classList.add("hidden");
          }, 3000);

        } else {
          mapMessage.textContent =
            "No valid sensor locations were found in the CSV.";
        }

        console.log(
          `Loaded ${sensorStations.length} sensor locations.`
        );
      })

      .catch(error => {
        console.error("Map data error:", error);

        mapMessage.textContent =
          "Could not load soil_thickness.csv. Check the browser console.";
      });

    // ==========================================
    // 8. UPDATE SIMULATED READINGS
    // Every 3 minutes; locations and labels stay fixed.
    // ==========================================

    window.setInterval(() => {
      sensorStations.forEach(station => {
        station.readings = generateSensorReadings();
        station.updatedAt = new Date();

        if (station.popupOpen) {
          station.marker.setPopupContent(
            sensorPopupHTML(station)
          );
        }
      });
    }, 180000);

  </script>
</body>
</html>
