```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SlopeGuard Monitoring Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div id="map"></div>
  <div id="mapMessage">Loading sensor locations...</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // --------------------------------------------------
    // 1. INITIALISE THE MAP
    // --------------------------------------------------

    const map = L.map("map").setView([20, 0], 2);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
      maxZoom: 19
    }).addTo(map);

    L.control.scale({ imperial: false }).addTo(map);

    const monitoringLayer = L.layerGroup().addTo(map);
    const sensorStations = [];

    const mapMessage = document.getElementById("mapMessage");

    // --------------------------------------------------
    // 2. HELPER FUNCTIONS
    // --------------------------------------------------

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function formatTime(date = new Date()) {
      return date.toLocaleTimeString("en-GB", {
        hour12: false
      });
    }

    function randomNumber(min, max, decimals = 1) {
      const value = Math.random() * (max - min) + min;
      return Number(value.toFixed(decimals));
    }

    // --------------------------------------------------
    // 3. SIMULATED SENSOR READINGS
    // --------------------------------------------------

    function generateSensorReadings() {
      return {
        rainfall: randomNumber(0, 30, 1),
        soilMoisture: randomNumber(25, 90, 1),
        tilt: randomNumber(0, 8, 2),
        acousticEstimate: randomNumber(0.5, 3.0, 2),
        waterIndex: randomNumber(0, 100, 1)
      };
    }

    // --------------------------------------------------
    // 4. CREATE UNIFORM SENSOR MARKERS
    // --------------------------------------------------

    function createSensorIcon(label) {
      return L.divIcon({
        className: "sensor-icon-container",
        html: `
          <div class="sensor-marker">
            ${escapeHTML(label)}
          </div>
        `,
        iconSize: [36, 36],
        iconAnchor: [18, 18],
        popupAnchor: [0, -18]
      });
    }

    // --------------------------------------------------
    // 5. SENSOR POPUP
    // Recorded soil thickness is intentionally excluded.
    // --------------------------------------------------

    function createPopupContent(station) {
      const readings = station.readings;

      return `
        <div class="sensor-popup">
          <div class="popup-heading">
            <span class="popup-status-dot"></span>
            <strong>${escapeHTML(station.id)}</strong>
          </div>

          <div class="popup-subtitle">
            Simulated landslide-monitoring readings
          </div>

          <div class="reading-row">
            <span>Rainfall</span>
            <strong>${readings.rainfall} mm/h</strong>
          </div>

          <div class="reading-row">
            <span>Soil moisture</span>
            <strong>${readings.soilMoisture}%</strong>
          </div>

          <div class="reading-row">
            <span>Tilt</span>
            <strong>${readings.tilt}°</strong>
          </div>

          <div class="reading-row">
            <span>Acoustic estimate</span>
            <strong>${readings.acousticEstimate}</strong>
          </div>

          <div class="reading-row">
            <span>Water index</span>
            <strong>${readings.waterIndex}%</strong>
          </div>

          <div class="update-status">
            <span class="update-dot"></span>
            Random demo readings · Updates every 5 seconds
          </div>

          <div class="last-updated">
            Last updated: ${station.lastUpdated}
          </div>

          <div class="popup-disclaimer">
            Sensor values are simulated for demonstration.
            The acoustic estimate and water index are placeholders,
            not validated measurements.
          </div>
        </div>
      `;
    }

    // --------------------------------------------------
    // 6. ADD A SENSOR STATION
    // --------------------------------------------------

    function addSensorStation(lat, lon) {
      const letter = String.fromCharCode(65 + sensorStations.length);

      const station = {
        id: `Sensor Reading ${letter}`,
        label: letter,
        lat,
        lon,
        readings: generateSensorReadings(),
        lastUpdated: formatTime(),
        marker: null
      };

      const marker = L.marker([lat, lon], {
        icon: createSensorIcon(letter),
        keyboard: true,
        title: station.id
      });

      station.marker = marker;

      marker.bindPopup(() => createPopupContent(station), {
        maxWidth: 340,
        minWidth: 270
      });

      marker.addTo(monitoringLayer);
      sensorStations.push(station);

      return station;
    }

    // --------------------------------------------------
    // 7. SEARCH-HIGHLIGHT FUNCTION FOR THE FRONTEND
    //
    // Usage:
    // highlightSensor("C")
    // highlightSensor("Sensor Reading C")
    // --------------------------------------------------

    let highlightStartTimer = null;
    let highlightEndTimer = null;
    let highlightedStation = null;

    function clearSensorHighlight() {
      if (highlightStartTimer !== null) {
        clearTimeout(highlightStartTimer);
        highlightStartTimer = null;
      }

      if (highlightEndTimer !== null) {
        clearTimeout(highlightEndTimer);
        highlightEndTimer = null;
      }

      if (highlightedStation) {
        const element = highlightedStation.marker.getElement();
        const marker = element?.querySelector(".sensor-marker");

        if (marker) {
          marker.classList.remove("sensor-highlight");
        }
      }

      highlightedStation = null;
    }

    window.highlightSensor = function(searchValue) {
      if (!searchValue || !String(searchValue).trim()) {
        console.warn("Enter a sensor label or name.");
        return false;
      }

      const query = String(searchValue).trim().toUpperCase();

      const station = sensorStations.find(sensor =>
        sensor.label.toUpperCase() === query ||
        sensor.id.toUpperCase() === query
      );

      if (!station) {
        console.warn("Sensor not found:", searchValue);
        return false;
      }

      clearSensorHighlight();
      highlightedStation = station;

      map.flyTo([station.lat, station.lon], 15, {
        animate: true,
        duration: 1.2
      });

      station.marker.openPopup();

      highlightStartTimer = setTimeout(() => {
        highlightStartTimer = null;

        const element = station.marker.getElement();
        const marker = element?.querySelector(".sensor-marker");

        if (!marker) {
          return;
        }

        marker.classList.add("sensor-highlight");

        highlightEndTimer = setTimeout(() => {
          marker.classList.remove("sensor-highlight");
          highlightEndTimer = null;
          highlightedStation = null;
        }, 4000);

      }, 1300);

      return true;
    };

    // --------------------------------------------------
    // 8. LOAD SENSOR LOCATIONS FROM CSV
    // Expected column names:
    // latitude_N, longitude_E
    //
    // Other CSV columns are ignored.
    // --------------------------------------------------

    function parseCSVLine(line) {
      return line.split(",").map(value =>
        value.trim().replace(/^"|"$/g, "")
      );
    }

    async function loadSensorStations() {
      try {
        const response = await fetch("./soil_thickness.csv");

        if (!response.ok) {
          throw new Error(
            `Could not load CSV (HTTP ${response.status}).`
          );
        }

        const csvText = await response.text();
        const lines = csvText.trim().split(/\r?\n/);

        if (lines.length < 2) {
          throw new Error("The CSV has no sensor location rows.");
        }

        const headers = parseCSVLine(lines[0]);

        const latIndex = headers.indexOf("latitude_N");
        const lonIndex = headers.indexOf("longitude_E");

        if (latIndex === -1 || lonIndex === -1) {
          throw new Error(
            "CSV must contain latitude_N and longitude_E columns."
          );
        }

        const rows = lines.slice(1)
          .filter(line => line.trim() !== "")
          .map(parseCSVLine)
          .map(row => ({
            lat: Number(row[latIndex]),
            lon: Number(row[lonIndex])
          }))
          .filter(point =>
            Number.isFinite(point.lat) &&
            Number.isFinite(point.lon) &&
            point.lat >= -90 &&
            point.lat <= 90 &&
            point.lon >= -180 &&
            point.lon <= 180
          );

        if (rows.length === 0) {
          throw new Error("No valid sensor coordinates found in CSV.");
        }

        // Select up to 5 evenly spaced locations from the CSV.
        const count = Math.min(5, rows.length);
        const selectedRows = [];

        for (let i = 0; i < count; i++) {
          const index = count === 1
            ? 0
            : Math.round(i * (rows.length - 1) / (count - 1));

          selectedRows.push(rows[index]);
        }

        selectedRows.forEach(point => {
          addSensorStation(point.lat, point.lon);
        });

        const bounds = L.latLngBounds(
          sensorStations.map(station => [station.lat, station.lon])
        );

        if (bounds.isValid()) {
          map.fitBounds(bounds, { padding: [50, 50] });

          if (sensorStations.length === 1) {
            map.setZoom(12);
          }
        }

        mapMessage.style.display = "none";

        console.log(
          `${sensorStations.length} sensor stations loaded.`
        );

      } catch (error) {
        console.error("Sensor loading error:", error);

        mapMessage.textContent =
          "Could not load sensor locations. Check soil_thickness.csv and run the project using a local web server.";

        mapMessage.classList.add("map-message-error");
      }
    }

    // --------------------------------------------------
    // 9. UPDATE READINGS EVERY 5 SECONDS
    // --------------------------------------------------

    setInterval(() => {
      sensorStations.forEach(station => {
        station.readings = generateSensorReadings();
        station.lastUpdated = formatTime();

        // Refresh the popup if it is currently open.
        if (station.marker.isPopupOpen()) {
          station.marker.setPopupContent(
            createPopupContent(station)
          );
        }
      });
    }, 5000);

    // Start loading the CSV.
    loadSensorStations();
  </script>
</body>
</html>
